name: Build FFmpeg

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  NASM_VERSION: "2.16.03"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Patch files — plain `git diff` of this fork (and its x264 fork) against
  # real upstream, for anyone who wants the mobiclip changes as a patch
  # instead of a full clone.
  # ─────────────────────────────────────────────────────────────────────────
  generate-patches:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Diff mobipeg against upstream FFmpeg
        run: |
          git remote add upstream https://github.com/FFmpeg/FFmpeg.git
          git fetch upstream master --quiet
          base=$(git merge-base HEAD upstream/master)
          git diff --no-color "$base" HEAD > mobipeg.patch
          echo "mobipeg.patch: $(wc -l < mobipeg.patch) lines"

      - name: Download upstream x264 and diff the MobiClip fork
        run: |
          git clone https://github.com/quatric/x264.git x264-src
          # The archive sidesteps VideoLAN's Anubis protection, which blocks
          # unauthenticated HTTPS Git fetches in CI. This artifact is for
          # review/applying elsewhere, so a source-tree diff is sufficient.
          # Anubis can respond 200 with an HTML challenge page instead of the
          # zip, which `curl --fail` won't catch — verify it's a real zip
          # before unzipping, retrying a few times if it isn't.
          for attempt in 1 2 3 4 5; do
            curl --fail --location --retry 3 --retry-all-errors \
              'https://code.videolan.org/videolan/x264/-/archive/master/x264-master.zip?ref_type=heads' \
              --output x264-upstream.zip
            if unzip -tq x264-upstream.zip >/dev/null 2>&1; then
              break
            fi
            echo "Attempt $attempt: download was not a valid zip (Anubis challenge page?), retrying..."
            rm -f x264-upstream.zip
            sleep $((attempt * 5))
          done
          unzip -q x264-upstream.zip
          diff -urN --exclude=.git x264-master x264-src > x264.patch || test $? -eq 1
          echo "x264.patch: $(wc -l < x264.patch) lines"

      - uses: actions/upload-artifact@v6
        with:
          name: patches
          path: |
            mobipeg.patch
            x264.patch
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Linux — native x86_64, native 32-bit x86, cross arm64 and armhf
  # ─────────────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            ffarch: x86_64
            triplet: x86_64-linux-gnu

          - target: linux-x86
            ffarch: x86
            triplet: i386-linux-gnu
            foreign_arch: i386
            # No separate cross-compiler needed; gcc-multilib handles -m32
            extra_configure: "--extra-cflags=-m32 --extra-ldflags=-m32 --cpu=generic"

          - target: linux-arm64
            ffarch: aarch64
            triplet: aarch64-linux-gnu
            foreign_arch: arm64
            cross_prefix: aarch64-linux-gnu-
            cross_pkgs: crossbuild-essential-arm64

          - target: linux-armhf
            ffarch: arm
            triplet: arm-linux-gnueabihf
            foreign_arch: armhf
            cross_prefix: arm-linux-gnueabihf-
            cross_pkgs: crossbuild-essential-armhf


    steps:
      - uses: actions/checkout@v5

      - name: Cache nasm
        id: cache-nasm
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/nasm
          key: nasm-${{ env.NASM_VERSION }}

      - name: Build and install nasm
        if: steps.cache-nasm.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://www.nasm.us/pub/nasm/releasebuilds/${{ env.NASM_VERSION }}/nasm-${{ env.NASM_VERSION }}.tar.xz" | tar -xJ
          cd nasm-${{ env.NASM_VERSION }}
          ./configure && make -j$(nproc) && sudo make install

      - name: Add foreign dpkg architecture
        if: matrix.foreign_arch != ''
        run: |
          sudo dpkg --add-architecture ${{ matrix.foreign_arch }}
          # Restrict existing sources to amd64/i386 only; add ports for ARM
          sudo sed -i 's/^deb /deb [arch=amd64,i386] /' /etc/apt/sources.list
          if [[ "${{ matrix.foreign_arch }}" == "arm64" || "${{ matrix.foreign_arch }}" == "armhf" ]]; then
            cat <<'EOF' | sudo tee -a /etc/apt/sources.list
          deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe
          deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe
          deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe
          EOF
          fi
          sudo apt-get update -qq

      - name: Install build tools and libraries
        run: |
          FOREIGN="${{ matrix.foreign_arch && format(':{0}', matrix.foreign_arch) || '' }}"
          CROSS_CC="${{ matrix.cross_pkgs || '' }}"
          MULTILIB="${{ matrix.foreign_arch == 'i386' && 'gcc-multilib g++-multilib' || '' }}"

          sudo apt-get remove -y "libx264-dev*" || true
          # ports.ubuntu.com occasionally lags the primary archive by a few
          # minutes, which can make a foreign-arch Multi-Arch:same package
          # (e.g. libssl3:arm64) transiently unresolvable. Retry with a
          # fresh index before giving up.
          for attempt in 1 2 3; do
            sudo apt-get install -y --no-install-recommends \
              build-essential pkgconf nasm \
              libc6-dev${FOREIGN} \
              zlib1g-dev${FOREIGN} \
              ${CROSS_CC} \
              ${MULTILIB} && break
            echo "apt-get install failed (attempt ${attempt}), retrying after apt-get update..."
            sleep 15
            sudo apt-get update -qq
          done

      - name: Set up pkg-config for cross target
        if: matrix.foreign_arch != ''
        run: |
          TRIPLET="${{ matrix.triplet }}"
          PKGDIR="/usr/lib/${TRIPLET}/pkgconfig"
          echo "PKG_CONFIG_LIBDIR=${PKGDIR}:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${PKGDIR}" >> "$GITHUB_ENV"
          # FFmpeg's configure uses $(CROSS_PREFIX)pkg-config — create a shim
          SHIM="/usr/local/bin/${{ matrix.cross_prefix }}pkg-config"
          printf '#!/bin/sh\nexec env PKG_CONFIG_LIBDIR=%s /usr/bin/pkg-config "$@"\n' "$PKGDIR" | sudo tee "$SHIM"
          sudo chmod +x "$SHIM"

      # ONE cache entry for the whole $DEPS prefix, shared by every dependency
      # installed into it.  Two actions/cache entries must never point at the
      # same path: whichever restores last unpacks its snapshot over the other's
      # freshly-built files.  x264 and libvorbis used to have separate entries
      # here (the vorbis key a constant), so a stale vorbis snapshot could put an
      # old x264.h back on top of a newly built one and break the ffmpeg build.
      # Key on the upstream x264 commit — the patched x264 keeps adding
      # x264_param_t fields, so anything longer-lived leaves ffmpeg compiling
      # against a stale header.  Rebuilding vorbis on an x264 bump is cheap.
      - name: Resolve x264 revision
        id: x264-rev
        run: echo "sha=$(git ls-remote https://github.com/quatric/x264.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/deps/${{ matrix.target }}
          # The x264 build now includes its architecture-specific assembly.
          # Keep this marker in the key so a previously cached scalar build
          # cannot be reused for a release artifact.
          key: deps-linux-${{ matrix.target }}-vorbis1.3.7-opus1.5.2-lame3.100-speex1.2.1-theora1.1.1-webp1.4.0-x264-${{ steps.x264-rev.outputs.sha }}-asm-on

      - name: Install foreign-arch codec headers (cross targets)
        if: matrix.foreign_arch != ''
        run: |
          FOREIGN=":${{ matrix.foreign_arch }}"
          sudo apt-get install -y --no-install-recommends \
            libopus-dev${FOREIGN} libmp3lame-dev${FOREIGN} libspeex-dev${FOREIGN} \
            libtheora-dev${FOREIGN} libwebp-dev${FOREIGN} || true

      - name: Build libogg + libvorbis
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps/${{ matrix.target }}"
          mkdir -p "$DEPS"

          sudo apt-get install -y --no-install-recommends automake 2>/dev/null || true
          CONFIGSUB=$(find /usr/share/automake* -name config.sub 2>/dev/null | head -1)
          CONFIGGUESS=$(find /usr/share/automake* -name config.guess 2>/dev/null | head -1)

          # libogg
          [ ! -d libogg-1.3.5 ] && curl -fsSL https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz | tar -xz
          cd libogg-1.3.5
          [ -n "$CONFIGSUB" ]   && cp "$CONFIGSUB"   config.sub
          [ -n "$CONFIGGUESS" ] && cp "$CONFIGGUESS" config.guess
          CROSS="--host=${{ matrix.triplet }}"
          # For 32-bit x86 on 64-bit host
          if [ "${{ matrix.target }}" = "linux-x86" ]; then
            export CFLAGS="-m32"
            export LDFLAGS="-m32"
          fi
          ./configure --prefix="$DEPS" $CROSS --enable-static --disable-shared
          make -j$(nproc) && make install
          cd ..

          # libvorbis
          [ ! -d libvorbis-1.3.7 ] && curl -fsSL https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz | tar -xz
          cd libvorbis-1.3.7
          [ -n "$CONFIGSUB" ]   && cp "$CONFIGSUB"   config.sub
          [ -n "$CONFIGGUESS" ] && cp "$CONFIGGUESS" config.guess
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          ./configure --prefix="$DEPS" $CROSS --with-ogg-includes="$DEPS/include" --with-ogg-libraries="$DEPS/lib" --enable-static --disable-shared
          make -j$(nproc) && make install
          cd ..

      - name: Build extra codec libraries (opus, lame, speex, theora, webp)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps/${{ matrix.target }}"
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          CROSS="--host=${{ matrix.triplet }}"
          if [ "${{ matrix.target }}" = "linux-x86" ]; then
            export CFLAGS="-m32"
            export LDFLAGS="-m32"
          fi

          sudo apt-get install -y --no-install-recommends automake 2>/dev/null || true
          CONFIGSUB=$(find /usr/share/automake* -name config.sub 2>/dev/null | head -1)
          CONFIGGUESS=$(find /usr/share/automake* -name config.guess 2>/dev/null | head -1)

          # libopus
          curl -fsSL https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz | tar -xz
          cd opus-1.5.2
          [ -n "$CONFIGSUB" ]   && cp "$CONFIGSUB"   config.sub
          [ -n "$CONFIGGUESS" ] && cp "$CONFIGGUESS" config.guess
          ./configure --prefix="$DEPS" $CROSS --enable-static --disable-shared --disable-doc --disable-extra-programs --disable-stack-protector
          make -j$(nproc) && make install
          cd ..

          # libmp3lame
          curl -fsSL https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz | tar -xz
          cd lame-3.100
          [ -n "$CONFIGSUB" ]   && cp "$CONFIGSUB"   config.sub
          [ -n "$CONFIGGUESS" ] && cp "$CONFIGGUESS" config.guess
          ./configure --prefix="$DEPS" $CROSS --enable-static --disable-shared --disable-frontend
          make -j$(nproc) && make install
          cd ..

          # libspeex
          curl -fsSL https://downloads.xiph.org/releases/speex/speex-1.2.1.tar.gz | tar -xz
          cd speex-1.2.1
          [ -n "$CONFIGSUB" ]   && cp "$CONFIGSUB"   config.sub
          [ -n "$CONFIGGUESS" ] && cp "$CONFIGGUESS" config.guess
          ./configure --prefix="$DEPS" $CROSS --enable-static --disable-shared
          make -j$(nproc) && make install
          cd ..

          # libtheora (needs libogg from the previous step)
          curl -fsSL https://downloads.xiph.org/releases/theora/libtheora-1.1.1.tar.gz | tar -xz
          cd libtheora-1.1.1
          [ -n "$CONFIGSUB" ]   && cp "$CONFIGSUB"   config.sub
          [ -n "$CONFIGGUESS" ] && cp "$CONFIGGUESS" config.guess
          ./configure --prefix="$DEPS" $CROSS --with-ogg-includes="$DEPS/include" --with-ogg-libraries="$DEPS/lib" \
            --enable-static --disable-shared --disable-examples --disable-oggtest --disable-vorbistest
          make -j$(nproc) && make install
          cd ..

          # libwebp
          curl -fsSL https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.4.0.tar.gz | tar -xz
          cd libwebp-1.4.0
          [ -n "$CONFIGSUB" ]   && cp "$CONFIGSUB"   config.sub
          [ -n "$CONFIGGUESS" ] && cp "$CONFIGGUESS" config.guess
          ./configure --prefix="$DEPS" $CROSS --enable-static --disable-shared \
            --disable-gl --disable-png --disable-jpeg --disable-tiff --disable-gif --disable-wic
          make -j$(nproc) && make install
          cd ..

      - name: Build x264
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps/${{ matrix.target }}"
          mkdir -p "$DEPS"
          git clone --depth=1 https://github.com/quatric/x264.git x264-src
          cd x264-src
          CROSS="--host=${{ matrix.triplet }} ${{ matrix.cross_prefix && format('--cross-prefix={0}', matrix.cross_prefix) || '' }}"
          ./configure \
            --prefix="$DEPS" \
            --enable-static \
            --enable-pic \
            --disable-cli \
            --disable-opencl \
            $CROSS || { cat config.log; exit 1; }
          make -j$(nproc) && make install

      - name: Configure FFmpeg
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps/${{ matrix.target }}"
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig:$PKG_CONFIG_PATH"
          CROSS="${{ matrix.cross_prefix && format('--cross-prefix={0} --target-os=linux', matrix.cross_prefix) || '' }}"
          ./configure \
            --prefix="$PWD/dist" \
            --arch=${{ matrix.ffarch }} \
            --enable-gpl \
            --enable-static \
            --disable-shared \
            --disable-doc \
            --disable-debug \
            --disable-sdl2 \
            --disable-bzlib \
            --disable-lzma \
            --disable-iconv \
            --disable-xlib \
            --enable-libx264 \
            --enable-libvorbis \
            --enable-libopus \
            --enable-libmp3lame \
            --enable-libspeex \
            --enable-libtheora \
            --enable-libwebp \
            --pkg-config-flags="--static" \
            $CROSS \
            --extra-cflags="-I$DEPS/include ${{ matrix.target_flag }}" \
            --extra-ldflags="-L$DEPS/lib ${{ matrix.target_flag }}" \
            ${{ matrix.extra_configure }} || { cat ffbuild/config.log; exit 1; }

      - name: Build
        run: make -j$(nproc)

      - name: Install
        run: make install

      - name: Package
        run: |
          cd dist/bin
          # ffplay may not exist for all cross targets
          FILES="ffmpeg ffprobe"
          [ -f ffplay ] && FILES="$FILES ffplay"
          tar -czf "../../mobipeg-${{ matrix.target }}.tar.gz" $FILES

      - uses: actions/upload-artifact@v6
        with:
          name: mobipeg-${{ matrix.target }}
          path: mobipeg-${{ matrix.target }}.tar.gz
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Windows x86, x86_64 and arm64 — cross-compiled from Ubuntu
  # x86/x86_64 use mingw-w64 (gcc), arm64 uses llvm-mingw (clang)
  # ─────────────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            ffarch: x86_64
            cross_prefix: x86_64-w64-mingw32
            use_llvm: false
            asm_flag: --disable-x86asm
            opus_configure: ""

          - target: windows-x86
            ffarch: x86
            cross_prefix: i686-w64-mingw32
            use_llvm: false
            asm_flag: --disable-x86asm
            opus_configure: ""

          - target: windows-arm64
            ffarch: aarch64
            cross_prefix: aarch64-w64-mingw32
            use_llvm: true
            asm_flag: --disable-asm
            # Opus 1.5.2's ARM RTCD does not support Windows/llvm-mingw.
            # --disable-asm alone still compiles celt/arm/armcpu.c, so disable
            # the run-time CPU dispatcher as well.
            opus_configure: --disable-asm --disable-rtcd

    steps:
      - uses: actions/checkout@v5

      - name: Cache nasm
        id: cache-nasm
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/nasm
          key: nasm-${{ env.NASM_VERSION }}

      - name: Build and install nasm
        if: steps.cache-nasm.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://www.nasm.us/pub/nasm/releasebuilds/${{ env.NASM_VERSION }}/nasm-${{ env.NASM_VERSION }}.tar.xz" | tar -xJ
          cd nasm-${{ env.NASM_VERSION }}
          ./configure && make -j$(nproc) && sudo make install

      - name: Install mingw-w64 (x86/x86_64)
        if: matrix.use_llvm == false
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkgconf nasm mingw-w64 mingw-w64-tools

      - name: Install llvm-mingw (arm64)
        if: matrix.use_llvm == true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkgconf nasm
          LLVM_MINGW_VER="20240619"
          wget -q "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VER}/llvm-mingw-${LLVM_MINGW_VER}-ucrt-ubuntu-20.04-x86_64.tar.xz"
          sudo tar -xJf "llvm-mingw-${LLVM_MINGW_VER}-ucrt-ubuntu-20.04-x86_64.tar.xz" -C /opt
          echo "/opt/llvm-mingw-${LLVM_MINGW_VER}-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH

      # x264 has no mingw apt package — build it from source.
      #
      # ONE cache entry for the whole $DEPS prefix, shared by x264 and
      # libogg/libvorbis.  These used to be two actions/cache entries on the same
      # path, and because the vorbis key was a constant while x264's tracked the
      # upstream commit, an x264 bump played out as: build fresh x264 into $DEPS
      # -> restore the stale vorbis snapshot over it -> old x264.h and
      # libx264.a are back -> ffmpeg fails to compile the new x264_param_t
      # fields (i_mobi_cq_* was the one that finally caught it).  Two cache
      # entries must never share a path; whichever restores last wins.
      #
      # Key on the upstream commit, and no restore-keys: a prefix fallback would
      # restore the stale headers anyway.
      - name: Resolve x264 revision
        id: x264-rev
        run: echo "sha=$(git ls-remote https://github.com/quatric/x264.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies for ${{ matrix.target }}
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/deps/${{ matrix.target }}
          # Match the Linux cache marker: these artifacts need an x264 build
          # with platform assembly enabled, not the older scalar-only build.
          key: deps-${{ matrix.target }}-vorbis1.3.7-opus1.5.2-no-hardening-no-arm-asm-or-rtcd-lame3.100-speex1.2.1-theora1.1.1-webp1.4.0-x264-${{ steps.x264-rev.outputs.sha }}-asm-on

      - name: Build x264 for ${{ matrix.target }}
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps/${{ matrix.target }}"
          mkdir -p "$DEPS"
          git clone --depth=1 https://github.com/quatric/x264.git x264-src
          cd x264-src
          ./configure \
            --prefix="$DEPS" \
            --host=${{ matrix.cross_prefix }} \
            --cross-prefix=${{ matrix.cross_prefix }}- \
            --enable-static \
            --enable-pic \
            --disable-cli \
            --disable-opencl
          make -j$(nproc) && make install

      - name: Install SDL2 for Windows
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps/${{ matrix.target }}"
          mkdir -p "$DEPS/include" "$DEPS/lib" "$DEPS/bin"
          wget -q https://github.com/libsdl-org/SDL/releases/download/release-2.30.0/SDL2-devel-2.30.0-mingw.tar.gz
          tar -xzf SDL2-devel-2.30.0-mingw.tar.gz
          SDL2_ARCH_DIR="SDL2-2.30.0/${{ matrix.cross_prefix }}"
          if [ -d "$SDL2_ARCH_DIR" ]; then
            cp -a "$SDL2_ARCH_DIR/include/SDL2" "$DEPS/include/"
            cp -a "$SDL2_ARCH_DIR/lib/"* "$DEPS/lib/"
            cp -a "$SDL2_ARCH_DIR/bin/SDL2.dll" "$DEPS/bin/"
            sed -i "s|^prefix=.*|prefix=$DEPS|" "$DEPS/lib/pkgconfig/sdl2.pc"
          else
            # Upstream SDL2 mingw releases don't ship an aarch64-w64-mingw32 dev
            # package, so this is expected on windows-arm64, not a build problem.
            echo "::notice::SDL2 not found for ${{ matrix.cross_prefix }} — ffplay will be omitted"
          fi


      - name: Build codec dependencies for ${{ matrix.target }}
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          set -e
          DEPS="${GITHUB_WORKSPACE}/deps/${{ matrix.target }}"
          mkdir -p "$DEPS"
          # Fetch up-to-date config.sub/config.guess so old tarballs accept
          # modern triples like aarch64-w64-mingw32 (used by llvm-mingw)
          sudo apt-get install -y --no-install-recommends automake 2>/dev/null || true
          CONFIGSUB=$(find /usr/share/automake* -name config.sub 2>/dev/null | head -1)
          CONFIGGUESS=$(find /usr/share/automake* -name config.guess 2>/dev/null | head -1)

          # libogg
          curl -fsSL https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz | tar -xz
          cd libogg-1.3.5
          [ -n "$CONFIGSUB" ]   && cp "$CONFIGSUB"   config.sub
          [ -n "$CONFIGGUESS" ] && cp "$CONFIGGUESS" config.guess
          ./configure \
            --prefix="$DEPS" \
            --host=${{ matrix.cross_prefix }} \
            --enable-static --disable-shared
          make -j$(nproc) && make install
          cd ..

          # libvorbis
          curl -fsSL https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz | tar -xz
          cd libvorbis-1.3.7
          [ -n "$CONFIGSUB" ]   && cp "$CONFIGSUB"   config.sub
          [ -n "$CONFIGGUESS" ] && cp "$CONFIGGUESS" config.guess
          PKG_CONFIG_PATH="$DEPS/lib/pkgconfig" \
          ./configure \
            --prefix="$DEPS" \
            --host=${{ matrix.cross_prefix }} \
            --with-ogg-includes="$DEPS/include" \
            --with-ogg-libraries="$DEPS/lib" \
            --enable-static --disable-shared
          make -j$(nproc) && make install
          cd ..

          # libopus
          curl -fsSL https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz | tar -xz
          cd opus-1.5.2
          [ -n "$CONFIGSUB" ]   && cp "$CONFIGSUB"   config.sub
          [ -n "$CONFIGGUESS" ] && cp "$CONFIGGUESS" config.guess
          # Opus 1.5.2 adds _FORTIFY_SOURCE=2 independently of its
          # --disable-hardening option.  MinGW's CRT has no __memcpy_chk,
          # so explicitly disable fortify for these static Windows builds.
          CFLAGS="-O2 -D_FORTIFY_SOURCE=0" ./configure \
            --prefix="$DEPS" \
            --host=${{ matrix.cross_prefix }} \
            --enable-static --disable-shared --disable-doc --disable-extra-programs \
            --disable-stack-protector --disable-hardening ${{ matrix.opus_configure }}
          make -j$(nproc) && make install
          cd ..

          # libmp3lame
          curl -fsSL https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz | tar -xz
          cd lame-3.100
          [ -n "$CONFIGSUB" ]   && cp "$CONFIGSUB"   config.sub
          [ -n "$CONFIGGUESS" ] && cp "$CONFIGGUESS" config.guess
          ./configure \
            --prefix="$DEPS" \
            --host=${{ matrix.cross_prefix }} \
            --enable-static --disable-shared --disable-frontend
          make -j$(nproc) && make install
          cd ..

          # libspeex
          curl -fsSL https://downloads.xiph.org/releases/speex/speex-1.2.1.tar.gz | tar -xz
          cd speex-1.2.1
          [ -n "$CONFIGSUB" ]   && cp "$CONFIGSUB"   config.sub
          [ -n "$CONFIGGUESS" ] && cp "$CONFIGGUESS" config.guess
          ./configure \
            --prefix="$DEPS" \
            --host=${{ matrix.cross_prefix }} \
            --enable-static --disable-shared
          make -j$(nproc) && make install
          cd ..

          # libtheora
          curl -fsSL https://downloads.xiph.org/releases/theora/libtheora-1.1.1.tar.gz | tar -xz
          cd libtheora-1.1.1
          [ -n "$CONFIGSUB" ]   && cp "$CONFIGSUB"   config.sub
          [ -n "$CONFIGGUESS" ] && cp "$CONFIGGUESS" config.guess
          ./configure \
            --prefix="$DEPS" \
            --host=${{ matrix.cross_prefix }} \
            --with-ogg-includes="$DEPS/include" \
            --with-ogg-libraries="$DEPS/lib" \
            --enable-static --disable-shared --disable-examples --disable-oggtest --disable-vorbistest
          make -j$(nproc) && make install
          cd ..

          # libwebp
          curl -fsSL https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.4.0.tar.gz | tar -xz
          cd libwebp-1.4.0
          [ -n "$CONFIGSUB" ]   && cp "$CONFIGSUB"   config.sub
          [ -n "$CONFIGGUESS" ] && cp "$CONFIGGUESS" config.guess
          ./configure \
            --prefix="$DEPS" \
            --host=${{ matrix.cross_prefix }} \
            --enable-static --disable-shared \
            --disable-gl --disable-png --disable-jpeg --disable-tiff --disable-gif --disable-wic
          make -j$(nproc) && make install

      - name: Create cross pkg-config shim
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps/${{ matrix.target }}"
          SHIM="/usr/local/bin/${{ matrix.cross_prefix }}-pkg-config"
          printf '#!/bin/sh\nexec env PKG_CONFIG_LIBDIR=%s PKG_CONFIG_PATH=%s /usr/bin/pkg-config "$@"\n' \
            "$DEPS/lib/pkgconfig" "$DEPS/lib/pkgconfig" | sudo tee "$SHIM"
          sudo chmod +x "$SHIM"

      - name: Configure FFmpeg
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps/${{ matrix.target }}"
          export PKG_CONFIG_PATH="${DEPS}/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="${DEPS}/lib/pkgconfig"
          # llvm-mingw ships a target pkg-config that precedes /usr/local/bin
          # in PATH and does not search our $DEPS prefix.  Use the shim by
          # absolute path so all Windows targets query their built libraries.
          ./configure \
            --prefix="${PWD}/dist" \
            --arch=${{ matrix.ffarch }} \
            --target-os=mingw32 \
            --cross-prefix=${{ matrix.cross_prefix }}- \
            --pkg-config="/usr/local/bin/${{ matrix.cross_prefix }}-pkg-config" \
            ${{ matrix.asm_flag }} \
            --enable-gpl \
            --enable-libx264 \
            --enable-libvorbis \
            --enable-libopus \
            --enable-libmp3lame \
            --enable-libspeex \
            --enable-libtheora \
            --enable-libwebp \
            --enable-static \
            --disable-shared \
            --disable-doc \
            --disable-debug \
            --disable-outdev=sdl2 \
            --disable-ffplay \
            --disable-dxva2 \
            --disable-d3d12va \
            --disable-vdpau \
            --disable-mediacodec \
            --disable-pthreads \
            --pkg-config-flags="--static" \
            --extra-cflags="-I$DEPS/include" \
            --extra-ldflags="-L$DEPS/lib -static" || { cat ffbuild/config.log; exit 1; }

      - name: Build
        run: make -j$(nproc)

      - name: Install
        run: make install

      - name: Package
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps/${{ matrix.target }}"
          cd dist/bin
          FILES=""
          for f in ffmpeg.exe ffprobe.exe ffplay.exe; do
            [ -f "$f" ] && FILES="$FILES $f"
          done
          # Include SDL2.dll for ffplay if it exists
          [ -f "$DEPS/bin/SDL2.dll" ] && cp "$DEPS/bin/SDL2.dll" . && FILES="$FILES SDL2.dll"
          zip "../../mobipeg-${{ matrix.target }}.zip" $FILES

      - uses: actions/upload-artifact@v6
        with:
          name: mobipeg-${{ matrix.target }}
          path: mobipeg-${{ matrix.target }}.zip
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # macOS — arm64 on macos-14, x86_64 on macos-13, then lipo into universal
  # ─────────────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew untap aws/tap || true
          brew update
          brew install yasm pkg-config nasm sdl2 meson ninja

      # This cache holds x264 too, so it has to track the upstream x264 commit
      # (see the linux job) — otherwise ffmpeg builds against a stale x264.h.
      - name: Resolve x264 revision
        id: x264-rev
        run: echo "sha=$(git ls-remote https://github.com/quatric/x264.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/deps
          key: deps-macos-universal-vorbis1.3.7-opus1.5.2-lame3.100-speex1.2.1-theora1.1.1-webp1.4.0-dav1d1.5.1-x264-${{ steps.x264-rev.outputs.sha }}

      - name: Build dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps"
          
          build_arch() {
            local ARCH=$1
            local TARGET_FLAG=$2
            local HOST_FLAG=$3
            local PREFIX="$DEPS/$ARCH"
            mkdir -p "$PREFIX"
            
            cd "$GITHUB_WORKSPACE"
            # libogg
            [ ! -d libogg-$ARCH ] && curl -fsSL https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz | tar -xz && mv libogg-1.3.5 libogg-$ARCH
            cd libogg-$ARCH
            ./configure --prefix="$PREFIX" $HOST_FLAG CFLAGS="$TARGET_FLAG" --enable-static --disable-shared
            make -j$(sysctl -n hw.logicalcpu) && make install
            cd ..
            
            # libvorbis
            [ ! -d libvorbis-$ARCH ] && curl -fsSL https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz | tar -xz && mv libvorbis-1.3.7 libvorbis-$ARCH
            cd libvorbis-$ARCH
            sed -i.bak 's/-force_cpusubtype_ALL//g' configure
            PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" ./configure --prefix="$PREFIX" $HOST_FLAG CFLAGS="$TARGET_FLAG" --with-ogg-includes="$PREFIX/include" --with-ogg-libraries="$PREFIX/lib" --enable-static --disable-shared
            make -j$(sysctl -n hw.logicalcpu) && make install
            cd ..
            
            # libopus
            [ ! -d opus-$ARCH ] && curl -fsSL https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz | tar -xz && mv opus-1.5.2 opus-$ARCH
            cd opus-$ARCH
            ./configure --prefix="$PREFIX" $HOST_FLAG CFLAGS="$TARGET_FLAG" --enable-static --disable-shared --disable-doc --disable-extra-programs
            make -j$(sysctl -n hw.logicalcpu) && make install
            cd ..

            # libmp3lame
            [ ! -d lame-$ARCH ] && curl -fsSL https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz | tar -xz && mv lame-3.100 lame-$ARCH
            cd lame-$ARCH
            ./configure --prefix="$PREFIX" $HOST_FLAG CFLAGS="$TARGET_FLAG" --enable-static --disable-shared --disable-frontend
            make -j$(sysctl -n hw.logicalcpu) && make install
            cd ..

            # libspeex
            [ ! -d speex-$ARCH ] && curl -fsSL https://downloads.xiph.org/releases/speex/speex-1.2.1.tar.gz | tar -xz && mv speex-1.2.1 speex-$ARCH
            cd speex-$ARCH
            ./configure --prefix="$PREFIX" $HOST_FLAG CFLAGS="$TARGET_FLAG" --enable-static --disable-shared
            make -j$(sysctl -n hw.logicalcpu) && make install
            cd ..

            # libtheora
            [ ! -d libtheora-$ARCH ] && curl -fsSL https://downloads.xiph.org/releases/theora/libtheora-1.1.1.tar.gz | tar -xz && mv libtheora-1.1.1 libtheora-$ARCH
            cd libtheora-$ARCH
            ./configure --prefix="$PREFIX" $HOST_FLAG CFLAGS="$TARGET_FLAG" --with-ogg-includes="$PREFIX/include" --with-ogg-libraries="$PREFIX/lib" --enable-static --disable-shared --disable-examples --disable-oggtest --disable-vorbistest
            make -j$(sysctl -n hw.logicalcpu) && make install
            cd ..

            # libwebp
            [ ! -d libwebp-$ARCH ] && curl -fsSL https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.4.0.tar.gz | tar -xz && mv libwebp-1.4.0 libwebp-$ARCH
            cd libwebp-$ARCH
            ./configure --prefix="$PREFIX" $HOST_FLAG CFLAGS="$TARGET_FLAG" --enable-static --disable-shared --disable-gl --disable-png --disable-jpeg --disable-tiff --disable-gif --disable-wic
            make -j$(sysctl -n hw.logicalcpu) && make install
            cd ..

            # x264
            [ ! -d x264-$ARCH ] && git clone --depth=1 https://github.com/quatric/x264.git x264-$ARCH
            cd x264-$ARCH
            ./configure --prefix="$PREFIX" $HOST_FLAG --extra-cflags="$TARGET_FLAG" --extra-ldflags="$TARGET_FLAG" --enable-static --enable-pic --disable-cli --disable-opencl
            make -j$(sysctl -n hw.logicalcpu) && make install
            cd ..

            # dav1d (software AV1 decoder)
            [ ! -d dav1d-$ARCH ] && curl -fsSL https://code.videolan.org/videolan/dav1d/-/archive/1.5.1/dav1d-1.5.1.tar.gz | tar -xz && mv dav1d-1.5.1 dav1d-$ARCH
            cd dav1d-$ARCH
            MESON_CROSS_ARGS=()
            if [ "$ARCH" = "x86_64" ]; then
              printf '%s\n' \
                "[binaries]" \
                "c = ['clang', '-target', 'x86_64-apple-macos11.0']" \
                "" \
                "[host_machine]" \
                "system = 'darwin'" \
                "cpu_family = 'x86_64'" \
                "cpu = 'x86_64'" \
                "endian = 'little'" \
                > cross-x86_64.txt
              MESON_CROSS_ARGS=(--cross-file cross-x86_64.txt)
            fi
            meson setup build --prefix="$PREFIX" --default-library=static --buildtype=release -Denable_tools=false -Denable_tests=false "${MESON_CROSS_ARGS[@]}"
            ninja -C build
            ninja -C build install
            cd ..
          }

          build_arch "arm64" "" ""
          build_arch "x86_64" "-target x86_64-apple-macos11.0" "--host=x86_64-apple-darwin"

      - name: Build FFmpeg
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps"
          
          build_ffmpeg() {
            local ARCH=$1
            local TARGET_FLAG=$2
            local PREFIX="$DEPS/$ARCH"
            local OUTDIR="$PWD/dist/$ARCH"
            
            mkdir -p build_ffmpeg_$ARCH
            cd build_ffmpeg_$ARCH
            
            export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
            ../configure \
              --prefix="$OUTDIR" \
              --arch=$ARCH \
              --enable-gpl \
              --enable-libx264 \
              --enable-libvorbis \
              --enable-libopus \
              --enable-libmp3lame \
              --enable-libspeex \
              --enable-libtheora \
              --enable-libwebp \
              --enable-libdav1d \
              --disable-doc \
              --disable-debug \
              --disable-outdev=sdl2 \
              --pkg-config-flags="--static" \
              --extra-cflags="-I$PREFIX/include $TARGET_FLAG" \
              --extra-ldflags="-L$PREFIX/lib $TARGET_FLAG" || { cat ffbuild/config.log; exit 1; }
            
            make -j$(sysctl -n hw.logicalcpu)
            make install
            cd ..
          }
          
          build_ffmpeg "arm64" ""
          build_ffmpeg "x86_64" "-target x86_64-apple-macos11.0"

      - name: lipo into universal binaries
        run: |
          mkdir -p dist/universal
          for bin in ffmpeg ffprobe ffplay; do
            arm="dist/arm64/bin/$bin"
            x64="dist/x86_64/bin/$bin"
            if [[ -f "$arm" && -f "$x64" ]]; then
              chmod +x "$arm" "$x64"
              lipo -create -output "dist/universal/$bin" "$arm" "$x64"
              echo "Created universal $bin: $(lipo -info dist/universal/$bin)"
            elif [[ -f "$arm" ]]; then
              cp "$arm" "dist/universal/$bin"
            fi
          done

      - name: Package
        run: |
          cd dist/universal
          FILES="ffmpeg ffprobe"
          [ -f ffplay ] && FILES="$FILES ffplay"
          tar -czf "../../mobipeg-macos-universal.tar.gz" $FILES

      - uses: actions/upload-artifact@v6
        with:
          name: mobipeg-macos-universal
          path: mobipeg-macos-universal.tar.gz
          retention-days: 7

  # Build VidInjector9002-CLI (3DS video-CIA packager), macOS only for now.
  # Vendored as a submodule rather than ported natively — see
  # third_party/VidInjector9000. mbedTLS is built from source because
  # Homebrew's package ships no CMake package config (find_package(MbedTLS)
  # needs MbedTLSConfig.cmake), and the project's own vendored-mbedtls
  # fallback path is disabled upstream with no submodule wired for it.
  # ─────────────────────────────────────────────────────────────────────────
  build-vidinjector-macos:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Init VidInjector9002-CLI's own submodules
        run: |
          # Only the CLI's dependencies (nnc, libdarc) -- NOT the GUI's
          # wxWidgets, which we don't build or need here.
          cd third_party/VidInjector9000
          git submodule update --init \
            VidInjector9002-CLI/extern/nnc \
            VidInjector9002-CLI/extern/libdarc

      - name: Cache mbedTLS
        id: cache-mbedtls
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/deps-mbedtls
          key: deps-mbedtls-v3.6.2-macos-universal

      - name: Build mbedTLS (mbedcrypto only — that's all VidInjector links)
        if: steps.cache-mbedtls.outputs.cache-hit != 'true'
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps-mbedtls"
          git clone --depth=1 --branch v3.6.2 https://github.com/Mbed-TLS/mbedtls.git mbedtls-src
          cd mbedtls-src
          git submodule update --init framework

          build_arch() {
            local ARCH=$1
            cmake -B "build-$ARCH" \
              -DCMAKE_BUILD_TYPE=Release \
              -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
              -DMBEDTLS_FATAL_WARNINGS=OFF \
              -DCMAKE_OSX_ARCHITECTURES="$ARCH" \
              -DCMAKE_INSTALL_PREFIX="$DEPS/$ARCH"
            cmake --build "build-$ARCH" -j"$(sysctl -n hw.logicalcpu)"
            cmake --install "build-$ARCH"
          }
          build_arch arm64
          build_arch x86_64

          # Merge into a universal install: headers + CMake config are
          # identical across arches, only the .a files need lipo.
          mkdir -p "$DEPS/universal/lib"
          cp -R "$DEPS/arm64/include" "$DEPS/universal/include"
          cp -R "$DEPS/arm64/lib/cmake" "$DEPS/universal/lib/cmake"
          cp -R "$DEPS/arm64/lib/pkgconfig" "$DEPS/universal/lib/pkgconfig"
          for lib in "$DEPS/arm64/lib/"*.a; do
            name=$(basename "$lib")
            lipo -create -output "$DEPS/universal/lib/$name" \
              "$DEPS/arm64/lib/$name" "$DEPS/x86_64/lib/$name"
          done

      - name: Build VidInjector9002-CLI
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps-mbedtls/universal"
          CLI_DIR="third_party/VidInjector9000/VidInjector9002-CLI"

          build_arch() {
            local ARCH=$1
            cmake -B "$CLI_DIR/build-$ARCH" -S "$CLI_DIR" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES="$ARCH" \
              -DCMAKE_PREFIX_PATH="$DEPS"
            cmake --build "$CLI_DIR/build-$ARCH" --config Release \
              -j"$(sysctl -n hw.logicalcpu)"
          }
          build_arch arm64
          build_arch x86_64

          mkdir -p dist
          lipo -create -output dist/VidInjector9002-CLI \
            "$CLI_DIR/build-arm64/VidInjector9002-CLI" \
            "$CLI_DIR/build-x86_64/VidInjector9002-CLI"
          chmod +x dist/VidInjector9002-CLI
          lipo -info dist/VidInjector9002-CLI

      - name: Package
        run: tar -czf mobipeg-vidinjector-macos-universal.tar.gz -C dist VidInjector9002-CLI

      - uses: actions/upload-artifact@v6
        with:
          name: mobipeg-vidinjector-macos-universal
          path: mobipeg-vidinjector-macos-universal.tar.gz
          retention-days: 7

  # VidInjector9002-CLI, Linux x86_64. Built natively on the same runner OS
  # build-gui already uses for linux-x86_64 (not cross-compiled from the
  # ffmpeg job's toolchains), since the CLI's own build only needs a plain
  # native cmake + g++ setup — matching its documented Linux build steps.
  # ─────────────────────────────────────────────────────────────────────────
  build-vidinjector-linux-x86_64:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Init VidInjector9002-CLI's own submodules
        run: |
          cd third_party/VidInjector9000
          git submodule update --init \
            VidInjector9002-CLI/extern/nnc \
            VidInjector9002-CLI/extern/libdarc

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake git

      - name: Cache mbedTLS
        id: cache-mbedtls
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/deps-mbedtls
          key: deps-mbedtls-v3.6.2-linux-x86_64

      # Built from source for the same reason as macOS: no distro package
      # reliably ships MbedTLSConfig.cmake, and find_package(MbedTLS) needs
      # the CMake package config, not just the library + headers.
      - name: Build mbedTLS (mbedcrypto only — that's all VidInjector links)
        if: steps.cache-mbedtls.outputs.cache-hit != 'true'
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps-mbedtls"
          git clone --depth=1 --branch v3.6.2 https://github.com/Mbed-TLS/mbedtls.git mbedtls-src
          cd mbedtls-src
          git submodule update --init framework
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
            -DMBEDTLS_FATAL_WARNINGS=OFF \
            -DCMAKE_INSTALL_PREFIX="$DEPS"
          cmake --build build -j"$(nproc)"
          cmake --install build

      - name: Build VidInjector9002-CLI
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps-mbedtls"
          CLI_DIR="third_party/VidInjector9000/VidInjector9002-CLI"
          cmake -B "$CLI_DIR/build" -S "$CLI_DIR" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$DEPS"
          cmake --build "$CLI_DIR/build" --config Release -j"$(nproc)"
          mkdir -p dist
          cp "$CLI_DIR/build/VidInjector9002-CLI" dist/
          chmod +x dist/VidInjector9002-CLI

      - name: Package
        run: tar -czf mobipeg-vidinjector-linux-x86_64.tar.gz -C dist VidInjector9002-CLI

      - uses: actions/upload-artifact@v6
        with:
          name: mobipeg-vidinjector-linux-x86_64
          path: mobipeg-vidinjector-linux-x86_64.tar.gz
          retention-days: 7

  # VidInjector9002-CLI, Windows x86_64. Built natively on windows-latest
  # (same runner OS build-gui uses for windows-x86_64), via MSVC + CMake —
  # the project's own documented Windows build path — rather than
  # cross-compiling with mingw from the ffmpeg job's Linux toolchains.
  # ─────────────────────────────────────────────────────────────────────────
  build-vidinjector-windows-x86_64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Init VidInjector9002-CLI's own submodules
        shell: bash
        run: |
          cd third_party/VidInjector9000
          git submodule update --init \
            VidInjector9002-CLI/extern/nnc \
            VidInjector9002-CLI/extern/libdarc

      - name: Cache mbedTLS
        id: cache-mbedtls
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/deps-mbedtls
          key: deps-mbedtls-v3.6.2-windows-x86_64

      - name: Build mbedTLS (mbedcrypto only — that's all VidInjector links)
        if: steps.cache-mbedtls.outputs.cache-hit != 'true'
        shell: bash
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps-mbedtls"
          git clone --depth=1 --branch v3.6.2 https://github.com/Mbed-TLS/mbedtls.git mbedtls-src
          cd mbedtls-src
          git submodule update --init framework
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
            -DMBEDTLS_FATAL_WARNINGS=OFF \
            -DCMAKE_INSTALL_PREFIX="$DEPS"
          cmake --build build --config Release -j"$(nproc || echo 4)"
          cmake --install build --config Release

      - name: Build VidInjector9002-CLI
        shell: bash
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps-mbedtls"
          CLI_DIR="third_party/VidInjector9000/VidInjector9002-CLI"
          cmake -B "$CLI_DIR/build" -S "$CLI_DIR" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$DEPS"
          cmake --build "$CLI_DIR/build" --config Release
          mkdir -p dist
          # MSVC multi-config generators put the binary in a Release/ subdir.
          if [ -f "$CLI_DIR/build/Release/VidInjector9002-CLI.exe" ]; then
            cp "$CLI_DIR/build/Release/VidInjector9002-CLI.exe" dist/
          else
            cp "$CLI_DIR/build/VidInjector9002-CLI.exe" dist/
          fi

      - name: Package
        shell: bash
        run: |
          cd dist
          7z a ../mobipeg-vidinjector-windows-x86_64.zip VidInjector9002-CLI.exe

      - uses: actions/upload-artifact@v6
        with:
          name: mobipeg-vidinjector-windows-x86_64
          path: mobipeg-vidinjector-windows-x86_64.zip
          retention-days: 7

  # VidInjector9002-CLI, Windows x86 (32-bit). Same windows-latest host as
  # the x86_64 job -- MSVC cross-targets 32-bit natively via -A Win32, no
  # separate runner needed.
  # ─────────────────────────────────────────────────────────────────────────
  build-vidinjector-windows-x86:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Init VidInjector9002-CLI's own submodules
        shell: bash
        run: |
          cd third_party/VidInjector9000
          git submodule update --init \
            VidInjector9002-CLI/extern/nnc \
            VidInjector9002-CLI/extern/libdarc

      - name: Cache mbedTLS
        id: cache-mbedtls
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/deps-mbedtls
          key: deps-mbedtls-v3.6.2-windows-x86

      - name: Build mbedTLS (mbedcrypto only — that's all VidInjector links)
        if: steps.cache-mbedtls.outputs.cache-hit != 'true'
        shell: bash
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps-mbedtls"
          git clone --depth=1 --branch v3.6.2 https://github.com/Mbed-TLS/mbedtls.git mbedtls-src
          cd mbedtls-src
          git submodule update --init framework
          cmake -B build -A Win32 -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
            -DMBEDTLS_FATAL_WARNINGS=OFF \
            -DCMAKE_INSTALL_PREFIX="$DEPS"
          cmake --build build --config Release -j"$(nproc || echo 4)"
          cmake --install build --config Release

      - name: Build VidInjector9002-CLI
        shell: bash
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps-mbedtls"
          CLI_DIR="third_party/VidInjector9000/VidInjector9002-CLI"
          cmake -B "$CLI_DIR/build" -S "$CLI_DIR" -A Win32 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$DEPS"
          cmake --build "$CLI_DIR/build" --config Release
          mkdir -p dist
          if [ -f "$CLI_DIR/build/Release/VidInjector9002-CLI.exe" ]; then
            cp "$CLI_DIR/build/Release/VidInjector9002-CLI.exe" dist/
          else
            cp "$CLI_DIR/build/VidInjector9002-CLI.exe" dist/
          fi

      - name: Package
        shell: bash
        run: |
          cd dist
          7z a ../mobipeg-vidinjector-windows-x86.zip VidInjector9002-CLI.exe

      - uses: actions/upload-artifact@v6
        with:
          name: mobipeg-vidinjector-windows-x86
          path: mobipeg-vidinjector-windows-x86.zip
          retention-days: 7

  # VidInjector9002-CLI, Windows arm64. Native windows-11-arm runner (same
  # host build-gui already uses for windows-arm64) -- the default generator
  # there targets ARM64 already, no extra flag needed.
  # ─────────────────────────────────────────────────────────────────────────
  build-vidinjector-windows-arm64:
    runs-on: windows-11-arm

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Init VidInjector9002-CLI's own submodules
        shell: bash
        run: |
          cd third_party/VidInjector9000
          git submodule update --init \
            VidInjector9002-CLI/extern/nnc \
            VidInjector9002-CLI/extern/libdarc

      - name: Cache mbedTLS
        id: cache-mbedtls
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/deps-mbedtls
          key: deps-mbedtls-v3.6.2-windows-arm64

      - name: Build mbedTLS (mbedcrypto only — that's all VidInjector links)
        if: steps.cache-mbedtls.outputs.cache-hit != 'true'
        shell: bash
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps-mbedtls"
          git clone --depth=1 --branch v3.6.2 https://github.com/Mbed-TLS/mbedtls.git mbedtls-src
          cd mbedtls-src
          git submodule update --init framework
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
            -DMBEDTLS_FATAL_WARNINGS=OFF \
            -DCMAKE_INSTALL_PREFIX="$DEPS"
          cmake --build build --config Release -j"$(nproc || echo 4)"
          cmake --install build --config Release

      - name: Build VidInjector9002-CLI
        shell: bash
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps-mbedtls"
          CLI_DIR="third_party/VidInjector9000/VidInjector9002-CLI"
          cmake -B "$CLI_DIR/build" -S "$CLI_DIR" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$DEPS"
          cmake --build "$CLI_DIR/build" --config Release
          mkdir -p dist
          if [ -f "$CLI_DIR/build/Release/VidInjector9002-CLI.exe" ]; then
            cp "$CLI_DIR/build/Release/VidInjector9002-CLI.exe" dist/
          else
            cp "$CLI_DIR/build/VidInjector9002-CLI.exe" dist/
          fi

      - name: Package
        shell: bash
        run: |
          cd dist
          7z a ../mobipeg-vidinjector-windows-arm64.zip VidInjector9002-CLI.exe

      - uses: actions/upload-artifact@v6
        with:
          name: mobipeg-vidinjector-windows-arm64
          path: mobipeg-vidinjector-windows-arm64.zip
          retention-days: 7

  # VidInjector9002-CLI, Linux arm64. Native ubuntu-22.04-arm runner (same
  # host build-gui already uses for linux-arm64, not the docker/QEMU path
  # used by linux-x86 and linux-armhf) -- plain native cmake + g++.
  # ─────────────────────────────────────────────────────────────────────────
  build-vidinjector-linux-arm64:
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Init VidInjector9002-CLI's own submodules
        run: |
          cd third_party/VidInjector9000
          git submodule update --init \
            VidInjector9002-CLI/extern/nnc \
            VidInjector9002-CLI/extern/libdarc

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake git

      - name: Cache mbedTLS
        id: cache-mbedtls
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/deps-mbedtls
          key: deps-mbedtls-v3.6.2-linux-arm64

      - name: Build mbedTLS (mbedcrypto only — that's all VidInjector links)
        if: steps.cache-mbedtls.outputs.cache-hit != 'true'
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps-mbedtls"
          git clone --depth=1 --branch v3.6.2 https://github.com/Mbed-TLS/mbedtls.git mbedtls-src
          cd mbedtls-src
          git submodule update --init framework
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
            -DMBEDTLS_FATAL_WARNINGS=OFF \
            -DCMAKE_INSTALL_PREFIX="$DEPS"
          cmake --build build -j"$(nproc)"
          cmake --install build

      - name: Build VidInjector9002-CLI
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps-mbedtls"
          CLI_DIR="third_party/VidInjector9000/VidInjector9002-CLI"
          cmake -B "$CLI_DIR/build" -S "$CLI_DIR" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$DEPS"
          cmake --build "$CLI_DIR/build" --config Release -j"$(nproc)"
          mkdir -p dist
          cp "$CLI_DIR/build/VidInjector9002-CLI" dist/
          chmod +x dist/VidInjector9002-CLI

      - name: Package
        run: tar -czf mobipeg-vidinjector-linux-arm64.tar.gz -C dist VidInjector9002-CLI

      - uses: actions/upload-artifact@v6
        with:
          name: mobipeg-vidinjector-linux-arm64
          path: mobipeg-vidinjector-linux-arm64.tar.gz
          retention-days: 7

  # Build GUI App using PyInstaller
  # ─────────────────────────────────────────────────────────────────────────
  build-gui:
    needs: [build-linux, build-windows, build-macos, build-vidinjector-macos,
            build-vidinjector-linux-x86_64, build-vidinjector-windows-x86_64,
            build-vidinjector-windows-x86, build-vidinjector-windows-arm64,
            build-vidinjector-linux-arm64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-22.04
            ext: tar.gz
            python_arch: x64

          - target: linux-x86
            os: ubuntu-22.04
            ext: tar.gz
            docker_platform: linux/386

          - target: linux-arm64
            os: ubuntu-22.04-arm
            ext: tar.gz
            python_arch: arm64

          - target: linux-armhf
            os: ubuntu-22.04
            ext: tar.gz
            docker_platform: linux/arm/v7

          - target: windows-x86_64
            os: windows-latest
            ext: zip
            python_arch: x64

          - target: windows-x86
            os: windows-latest
            ext: zip
            python_arch: x86

          - target: windows-arm64
            os: windows-11-arm
            ext: zip
            python_arch: arm64

          - target: macos-universal
            os: macos-14
            ext: tar.gz
            python_arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU (cross-arch Linux builds)
        if: matrix.docker_platform != ''
        uses: docker/setup-qemu-action@v3

      - name: Setup Python
        if: matrix.docker_platform == ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}

      - name: Download FFmpeg artifact
        uses: actions/download-artifact@v6
        with:
          name: mobipeg-${{ matrix.target }}
          path: artifact

      - name: Extract artifact
        shell: bash
        run: |
          cd artifact
          if [[ "${{ matrix.ext }}" == "tar.gz" ]]; then
            tar -xzf mobipeg-*.tar.gz
          else
            unzip mobipeg-*.zip
          fi

      # Built for every target except 32-bit/ARMv7 Linux (linux-x86,
      # linux-armhf), which go through the Docker/QEMU cross path in
      # build-vidinjector-* -- not worth the risk of an unverifiable
      # emulated cmake+mbedTLS+C++20 cross-build. Those two just won't have
      # the Package CIA step wired to a binary.
      - name: Download VidInjector9002-CLI artifact
        if: contains(fromJSON('["macos-universal", "linux-x86_64", "linux-arm64", "windows-x86_64", "windows-x86", "windows-arm64"]'), matrix.target)
        uses: actions/download-artifact@v6
        with:
          name: mobipeg-vidinjector-${{ matrix.target }}
          path: artifact-vidinjector

      - name: Extract VidInjector9002-CLI artifact
        if: contains(fromJSON('["macos-universal", "linux-x86_64", "linux-arm64", "windows-x86_64", "windows-x86", "windows-arm64"]'), matrix.target)
        shell: bash
        run: |
          cd artifact-vidinjector
          if [ -f mobipeg-vidinjector-*.tar.gz ]; then
            tar -xzf mobipeg-vidinjector-*.tar.gz
            chmod +x VidInjector9002-CLI
          else
            unzip mobipeg-vidinjector-*.zip
          fi

      - name: Build PyInstaller App (Docker / QEMU)
        if: matrix.docker_platform != ''
        run: |
          # Run inside a native-arch container so PyInstaller produces the right ELF
          docker run --rm --platform "${{ matrix.docker_platform }}" \
            -v "$PWD:/work" -w /work \
            python:3.12-slim bash -c "
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                python3-tk binutils build-essential zlib1g-dev libjpeg-dev
              pip install --quiet pyinstaller Pillow
              pyinstaller --name mobipeg-gui --windowed \
                --add-binary artifact/ffmpeg:. \
                --add-binary artifact/ffprobe:. \
                --add-data logo.png:. \
                --distpath pyinst_dist encode_gui.py
              tar -czf mobipeg-gui-${{ matrix.target }}.tar.gz -C pyinst_dist mobipeg-gui
            "
          # Fix root-owned output files created inside the container
          sudo chown "$USER" mobipeg-gui-${{ matrix.target }}.tar.gz

      - name: Build PyInstaller App (native)
        if: matrix.docker_platform == ''
        shell: bash
        run: |
          python -m pip install pyinstaller Pillow
          if [[ "${{ matrix.target }}" == windows* ]]; then
            FFMPEG_BIN="artifact/ffmpeg.exe"
            FFPROBE_BIN="artifact/ffprobe.exe"
            FFPLAY_BIN="artifact/ffplay.exe"
            SDL2_BIN="artifact/SDL2.dll"
            BINARY_ARGS=(--add-binary "$FFMPEG_BIN;." --add-binary "$FFPROBE_BIN;.")
            # ffplay.exe/SDL2.dll may be absent for some targets (e.g. arm64) — include only if present
            if [ -f "$FFPLAY_BIN" ] && [ -f "$SDL2_BIN" ]; then
              BINARY_ARGS+=(--add-binary "$FFPLAY_BIN;." --add-binary "$SDL2_BIN;.")
            fi
            [ -f "artifact-vidinjector/VidInjector9002-CLI.exe" ] && \
              BINARY_ARGS+=(--add-binary "artifact-vidinjector/VidInjector9002-CLI.exe;.")
            pyinstaller --name "mobipeg-gui" --windowed \
              "${BINARY_ARGS[@]}" \
              --add-data "logo.png;." --icon=logo.png \
              --version-file version_info.txt \
              --distpath pyinst_dist encode_gui.py
            cd pyinst_dist
            # 7z may not exist on arm64 Windows runners — fall back to PowerShell
            7z a ../mobipeg-gui-${{ matrix.target }}.zip mobipeg-gui 2>/dev/null \
              || powershell -Command "Compress-Archive -Path mobipeg-gui -DestinationPath ../mobipeg-gui-${{ matrix.target }}.zip"
          elif [[ "${{ matrix.target }}" == "macos-universal" ]]; then
            FFMPEG_BIN="artifact/ffmpeg"
            FFPROBE_BIN="artifact/ffprobe"
            FFPLAY_BIN="artifact/ffplay"
            BINARY_ARGS=(--add-binary "$FFMPEG_BIN:." --add-binary "$FFPROBE_BIN:.")
            # ffplay is only present if SDL2 was found during the FFmpeg build
            [ -f "$FFPLAY_BIN" ] && BINARY_ARGS+=(--add-binary "$FFPLAY_BIN:.")
            BINARY_ARGS+=(--add-binary "artifact-vidinjector/VidInjector9002-CLI:.")
            pyinstaller --name "mobipeg-gui" --windowed \
              "${BINARY_ARGS[@]}" --add-data "logo.png:." \
              --icon=logo.png --distpath pyinst_dist \
              --target-architecture universal2 encode_gui.py
            cd pyinst_dist
            zip -r ../mobipeg-gui-${{ matrix.target }}.zip mobipeg-gui.app
          else
            # Native Linux (x86_64, arm64)
            sudo apt-get install python3-tk -y || true
            FFMPEG_BIN="artifact/ffmpeg"
            FFPROBE_BIN="artifact/ffprobe"
            BINARY_ARGS=(--add-binary "$FFMPEG_BIN:." --add-binary "$FFPROBE_BIN:.")
            [ -f "artifact-vidinjector/VidInjector9002-CLI" ] && \
              BINARY_ARGS+=(--add-binary "artifact-vidinjector/VidInjector9002-CLI:.")
            pyinstaller --name "mobipeg-gui" --windowed \
              "${BINARY_ARGS[@]}" \
              --add-data "logo.png:." \
              --icon=logo.png --distpath pyinst_dist encode_gui.py
            cd pyinst_dist
            tar -czf ../mobipeg-gui-${{ matrix.target }}.tar.gz mobipeg-gui
          fi

      - name: Upload GUI App
        uses: actions/upload-artifact@v6
        with:
          name: mobipeg-gui-${{ matrix.target }}
          path: mobipeg-gui-${{ matrix.target }}.*
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Release — publishes tagged builds so other projects (e.g. the wszst-gui
  # build in wiimms-szs-tools-plus, which bundles the mobipeg CLI binary for
  # its passthru media transcoding) have a stable public download instead of
  # having to pull an ephemeral per-run Action artifact across repos.
  # ─────────────────────────────────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows, build-macos, build-gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: dist
      - name: Create source archive
        run: |
          tag="${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="mobipeg-${tag}/" \
            -o "mobipeg-${tag}-source.tar.gz" HEAD
      - name: Package each target
        run: |
          cd dist
          for d in */; do
            [ -d "$d" ] || continue
            # build-linux/windows/macos already upload pre-packaged
            # .tar.gz/.zip files directly (not a directory of loose files
            # like the szs/iso-tools forks) -- just hoist those out, and
            # only re-tar directories that actually contain loose files.
            find "$d" -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} .. \;
            remaining=$(find "$d" -mindepth 1 | head -1)
            if [ -n "$remaining" ]; then
              tar -czf "../${d%/}.tar.gz" -C "$d" .
            fi
          done
      - name: Create checksums
        run: |
          sha256sum *.tar.gz *.zip 2>/dev/null > SHA256SUMS.txt || true
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.zip
            SHA256SUMS.txt
